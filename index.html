function drawList(){const frag=document.createDocumentFragment();for(const r of visible){const card=document.createElement('div');card.className='entry';card.dataset.id=r.project_id;card.setAttribute('aria-current',String(r.project_id===selected));const b=document.createElement('button');b.type='button';b.className='entrypick';b.setAttribute('aria-label',clean(r.title)+' 열기');b.setAttribute('aria-current',String(r.project_id===selected));const m=document.createElement('span');m.className='entrymeta';const n=document.createElement('span');n.textContent=String(r.collection_no).padStart(3,'0')+' · '+majors[r.major];const mark=document.createElement('span');mark.className='gradebadge';mark.textContent=gradeNames[gradeOf(r)];m.append(n,mark);const t=document.createElement('span');t.className='entrytitle';t.textContent=clean(r.title);const k=document.createElement('span');k.className='entrymaker';k.textContent=clean(r.maker)+(done.has(r.project_id)?' · 검토 완료':'');b.append(m,t,k);b.addEventListener('click',()=>choose(r.project_id));const buttons=document.createElement('div');buttons.className='gradebuttons';buttons.setAttribute('role','group');buttons.setAttribute('aria-label',clean(r.title)+' 등급');makeGradeButtons(buttons,r);card.append(b,buttons);frag.appendChild(card);}if(!visible.length){const p=document.createElement('p');p.className='empty';p.textContent='조건에 맞는 글이 없습니다.';frag.appendChild(p);}el('list').replaceChildren(frag);el('count').textContent=visible.length+' / '+rows.length+'편';const base=rows.filter(matchesBase);el('doneCount').textContent='검토 '+base.filter(r=>done.has(r.project_id)).length+' / '+base.length;}
function displayURL(r){const u=new URL(r.url);if(u.hostname==='blog.naver.com')u.hostname='m.blog.naver.com';return u.href;}
function paint(){const r=visible.find(r=>r.project_id===selected);const i=visible.indexOf(r);el('prev').disabled=!r||i===0;el('next').disabled=!r||i===visible.length-1;el('reviewed').disabled=!r;el('reload').disabled=!r;el('external').hidden=!r;el('info').hidden=!r;el('empty').hidden=!!r;el('story').hidden=!r;el('reviewed').checked=!!r&&done.has(r.project_id);el('notionSource').hidden=!r?.source_page;makeGradeButtons(el('readerGrades'),r);if(!r){el('title').textContent='조건에 맞는 글 없음';el('meta').textContent='대분류·등급 또는 검색어를 바꿔 주세요.';el('position').textContent='0편';if(loaded!==null){el('story').src='about:blank';loaded=null;}return;}el('position').textContent=majors[r.major]+' · 현재 목록 '+(i+1)+' / '+visible.length;el('title').textContent=clean(r.title);el('meta').textContent=clean(r.maker)+' · '+gradeNames[gradeOf(r)];el('external').href=r.url;if(r.source_page)el('notionSource').href=r.source_page;el('info').open=false;el('detail').replaceChildren();for(const line of [r.reason_selected,r.verification_scope,r.detail_checked_at?'확인 기록: '+r.detail_checked_at:null,r.access_note])if(line){const p=document.createElement('p');p.textContent=line;el('detail').appendChild(p);}el('hint').textContent=r.major==='wadiz'?'와디즈 원문을 표시합니다. 본문이 접혀 있으면 ‘스토리 더보기’를 누르세요. 원문이 표시되지 않으면 ‘별도 탭으로 보기’를 이용하세요.':'원문을 표시합니다. 사이트에서 화면 내 표시를 제한하면 ‘별도 탭으로 보기’를 이용하세요. Notion 레퍼런스에서 기존 정리도 볼 수 있습니다.';if(loaded!==r.project_id){el('story').title=clean(r.title)+' · 원문';el('story').src=displayURL(r);loaded=r.project_id;}for(const card of el('list').querySelectorAll('.entry')){card.setAttribute('aria-current',String(card.dataset.id===selected));card.querySelector('.entrypick').setAttribute('aria-current',String(card.dataset.id===selected));}}
function refresh(preferredIndex=0){visible=rows.filter(r=>matchesBase(r)&&(gradeFilter==='all'||gradeOf(r)===gradeFilter));if(!visible.some(r=>r.project_id===selected))selected=visible[Math.min(preferredIndex,visible.length-1)]?.project_id||null;drawFilters();drawList();paint();}
function setGrade(id,g){if(!validIds.has(id)||!Object.hasOwn(gradeNames,g))return;const r=rows.find(r=>r.project_id===id);const index=Math.max(0,visible.findIndex(r=>r.project_id===selected));const y=el('list').scrollTop;grades[id]=g;refresh(index);el('list').scrollTop=y;save();const remains=visible.some(r=>r.project_id===id);el('notice').textContent=clean(r.title)+' → '+gradeNames[g]+(storageOK?' 저장됨':' · 현재 화면에만 적용됨')+(remains?'':' · 현재 필터 목록에서 제외됨');}
function choose(id,scroll=false){if(!visible.some(r=>r.project_id===id))return;selected=id;el('notice').textContent='';paint();save();if(scroll)for(const card of el('list').querySelectorAll('.entry'))if(card.dataset.id===id)card.scrollIntoView({block:'nearest'});}
function step(delta){const i=visible.findIndex(r=>r.project_id===selected);if(i+delta>=0&&i+delta<visible.length)choose(visible[i+delta].project_id,true);}
el('search').addEventListener('input',()=>{query=el('search').value.trim();el('notice').textContent='';refresh();save();});
el('major').addEventListener('change',()=>{major=el('major').value;el('notice').textContent='';refresh();save();});
el('prev').addEventListener('click',()=>step(-1));el('next').addEventListener('click',()=>step(1));
el('reviewed').addEventListener('change',()=>{if(!selected)return;el('reviewed').checked?done.add(selected):done.delete(selected);const y=el('list').scrollTop;drawList();el('list').scrollTop=y;save();});
el('reload').addEventListener('click',()=>{loaded=null;paint();});
let sidebarCollapsed=false;
try{sidebarCollapsed=localStorage.getItem('glens-sidebar-collapsed')==='1';}catch{}
function renderSidebar(){el('workspace').classList.toggle('hide-list',sidebarCollapsed);const label=sidebarCollapsed?'사이드바 펼치기':'사이드바 접기';el('toggleList').textContent=label;for(const id of ['toggleList','sidebarToggle']){el(id).setAttribute('aria-expanded',String(!sidebarCollapsed));el(id).setAttribute('aria-controls','sidebar');el(id).setAttribute('aria-label',label);el(id).title=label;}el('sidebarToggle').textContent=sidebarCollapsed?'›':'‹';}
function toggleSidebar(){sidebarCollapsed=!sidebarCollapsed;renderSidebar();try{localStorage.setItem('glens-sidebar-collapsed',sidebarCollapsed?'1':'0');}catch{}}
el('toggleList').addEventListener('click',toggleSidebar);
el('sidebarToggle').addEventListener('click',toggleSidebar);
renderSidebar();
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')||e.target.isContentEditable)return;if(e.target.closest('#list')&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();step(e.key==='ArrowDown'?1:-1);}});
refresh();save();
})();
</script></body></html>
